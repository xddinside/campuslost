server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: campuslost-backend
  config:
    import: optional:file:./.secrets/local.properties,optional:file:../.secrets/backend.properties
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/lostfound?useUnicode=true&characterEncoding=utf8}
    username: ${DB_USERNAME:lostfound}
    password: ${DB_PASSWORD:lostfound}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Lock-then-reread workflows need each statement to see committed rows.
      # MariaDB's default REPEATABLE READ raises "record has changed since last
      # read" when SELECT ... FOR UPDATE follows an earlier snapshot read.
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # No silent adoption: an existing unversioned database must be backed up
    # and baselined deliberately (see README "Adopting a pre-Flyway database")
    # before migrations run against it.
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    # Dialect-specific migration folders: V2 uses syntax MySQL 8 rejects, so
    # each vendor ships its own copy. Set DB_VENDOR=mysql for MySQL hosts
    # (Render + Aiven); the default stays mariadb for local development.
    locations: classpath:db/migration/common,classpath:db/migration/${DB_VENDOR:mariadb}
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Origin patterns (port wildcard allowed): the dev proxy may bind any
    # port, and deployments still override with exact origins via env.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://campuslost.localhost:*,https://campuslost.localhost:*}
  photos:
    # filesystem keeps bytes under `directory`; database stores them in the
    # photo_blobs table for hosts with ephemeral disks.
    storage: ${APP_PHOTOS_STORAGE:filesystem}
    directory: ${APP_PHOTOS_DIR:uploads}
    max-bytes: 5242880
    max-uploads-per-day: 20
  rate-limit:
    login-attempts: ${APP_LOGIN_RATE_LIMIT:10}
    login-window-seconds: 60
    register-attempts: ${APP_REGISTER_RATE_LIMIT:5}
    register-window-seconds: 300
  demo:
    seed: false
  handover:
    hmac-secret: ${APP_HANDOVER_HMAC_SECRET:}

logging:
  level:
    root: INFO
    com.lostfound: INFO
