spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/lostfound_test?useUnicode=true&characterEncoding=utf8
    username: lostfound
    password: lostfound
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: false
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

app:
  jwt:
    secret: dGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQ=
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:3000
  photos:
    directory: target/test-uploads
    max-bytes: 5242880
    max-uploads-per-day: 20
  rate-limit:
    login-attempts: 1000
    login-window-seconds: 60
    register-attempts: 1000
    register-window-seconds: 300
  demo:
    seed: false
  handover:
    hmac-secret: dGVzdC1obWFjLXRlc3QtaG1hYy10ZXN0LWhtYWMtdGVzdC1obWFjLXRlc3QtaG1hYw==

logging:
  level:
    root: WARN
    com.lostfound: INFO
